# MLX LoRA config for PolicyGuard (Tiny Aya Global, 3.35B)
model: CohereLabs/tiny-aya-global
train: true
data: data/mlx
adapter_path: adapters/policyguard_v2
fine_tune_type: lora
mask_prompt: true
num_layers: 16           # LoRA on the top 16 transformer blocks
batch_size: 2
iters: 621
learning_rate: 1.0e-4
max_seq_length: 3072
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 100
val_batches: 10
save_every: 100
seed: 13
lora_parameters:
  rank: 16
  scale: 2.0             # alpha / rank = 32 / 16
  dropout: 0.05
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]
